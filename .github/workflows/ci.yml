name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile backend/main.py backend/models.py backend/recommendation.py backend/database.py backend/config.py tests/test_recommendation.py tests/test_api.py

      - name: Run tests
        run: python -m unittest tests.test_recommendation tests.test_api
