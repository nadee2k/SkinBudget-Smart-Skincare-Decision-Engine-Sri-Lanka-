<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinBudget | Smart Skincare Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1>SkinBudget</h1>
            <p>Your Data-Driven Skincare Decision Engine</p>
        </header>

        <section class="glass-panel">
            <form id="recommend-form">
                <div class="form-group">
                    <label for="skin_type">Skin Type</label>
                    <div class="custom-select-wrapper">
                        <select id="skin_type" required>
                            <option value="" disabled selected>Loading...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Skin Concerns (Select Multiple)</label>
                    <div id="concerns-container" class="chip-container">
                        <!-- Chips loaded dynamically -->
                        <span class="loading-text">Loading...</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="budget">Total Budget (LKR)</label>
                    <input type="number" id="budget" min="1000" step="500" value="10000" required>
                </div>

                <button type="submit" class="cta-button">
                    <span>Generate Routine</span>
                    <div class="spinner hidden" id="loading-spinner"></div>
                </button>
            </form>
        </section>

        <section id="results-section" class="results-section hidden">
            <h2>Your Recommended Routine</h2>
            <div id="routine-container" class="routine-grid">
                <!-- Routine items injected here -->
            </div>
            
            <div class="total-summary">
                <span>Total Estimated Cost: </span>
                <span id="total-cost">LKR 0</span>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
